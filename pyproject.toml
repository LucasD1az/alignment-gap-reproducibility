[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment-gap-reproducibility"
version = "0.1.7"
description = "Reproducibility code for The Alignment Gap"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Lucas Díaz Celauro"},
  {name = "Sebastián Pinto"},
  {name = "Sofia del Pozo"},
  {name = "Matteo Serafino"},
  {name = "Pablo Balenzuela"},
  {name = "Hernán A. Makse"},
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "plotly>=5.20",
  "kaleido>=1.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
